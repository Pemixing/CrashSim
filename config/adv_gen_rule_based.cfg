# data options
data_dir: /path/to/nuscenes
data_version: trainval
split: val
# val_size: 850 # num scenes
# seq_interval: 1 
val_size: 400
seq_interval: 10 # 5 seconds between sequences.
shuffle: False
num_workers: 0
batch_size: 1 # sets the approximate num agents across all scenes being optimized

# traffic model weights
pretrained_ae_path: /path/to/pretrain_model/traffic_model.pth

ckpt: /path/to/checkpoints/diffusion_model.pth # 'z2z-cond-z'

# how to operate
feasibility_check_sep: True
planner_cfg: 'default'

viz: True
save: True # save the scenarios

# optimization options
# num_iters: 200
num_iters: 50
lr: 0.05

# init optim
init_loss_motion_prior_ext: 0.01
init_loss_match_ext: 10.0
# adv optim
loss_coll_veh: 20.0
loss_coll_veh_plan: 20.0
loss_coll_env: 20.0
loss_init_z: 0.5 
loss_init_z_atk: 0.05
loss_motion_prior: 1.0
loss_motion_prior_atk: 0.005
loss_motion_prior_ext: 0.0001
loss_match_ext: 10.0
loss_adv_crash: 2.0

# sampling settings
test_sample_num: 10
test_sample_future_len: 12
# sampling (qual)
test_sample_viz_multi: True
test_sample_viz_rollout: False
# sampling (quant)
test_sample_disp_err: True
test_sample_coll_rate: True
# reconstruction (qual and quant), aka inference
test_recon_viz_multi: False
test_recon_coll_rate: False

#diffuser
n_timesteps: 20
dim: 64 #64
dim_mults: [1, 4, 8] #[1, 4, 8]
